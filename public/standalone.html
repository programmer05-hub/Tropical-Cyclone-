  <meta name="theme-color" content="#020617" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            radar: {
              50: '#ecfeff',
              500: '#06b6d4',
              900: '#083344',
              950: '#021824',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone for direct file:// Chrome execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar-sweep {
      animation: radarSweep 4s linear infinite;
      transform-origin: center;
    }
    @keyframes eyePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .eye-pulse {
      animation: eyePulse 2s ease-in-out infinite;
    }
    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spin-slow {
      animation: spinSlow 12s linear infinite;
      transform-origin: center;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    const DEFAULT_SOS_PINGS = [
      {
        id: "SOS-701",
        residentName: "A. Patnaik (Family of 4)",

    function MainApp() {
      const [activeStormId, setActiveStormId] = useState(() => {
        try { return localStorage.getItem("cyclone_active_storm") || "fani"; } catch { return "fani"; }
      });

      const [sosPings, setSosPings] = useState(() => {
        try {
          const saved = localStorage.getItem("cyclone_sos_pings");
          return saved ? JSON.parse(saved) : DEFAULT_SOS_PINGS;
        } catch { return DEFAULT_SOS_PINGS; }
      });

      const [customAlerts, setCustomAlerts] = useState(() => {
        try {
          const saved = localStorage.getItem("cyclone_alerts");
          return saved ? JSON.parse(saved) : [
            {
              id: "ALT-1",
              level: "CRITICAL RED ALERT",
              audience: "Coastal Residents (0-10 km Inundation Zone)",
              text: "IMMEDIATE EVACUATION ORDER: Severe Tropical Cyclone approaching with 5.2m peak storm surge. Move inland to high-elevation multi-purpose shelters immediately. Contraflow lanes are ACTIVE on NH-16.",
              time: "08:15 UTC"
            }
          ];
        } catch { return []; }
      });

      const [mapType, setMapType] = useState(() => {
        try { return localStorage.getItem("cyclone_map_type") || "satellite"; } catch { return "satellite"; }
      });

      const [activeTab, setActiveTab] = useState("overview");
      const [isSimulating, setIsSimulating] = useState(true);
      const [simOffsetHours, setSimOffsetHours] = useState(0);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [newSosModal, setNewSosModal] = useState(false);
      const [broadcastInput, setBroadcastInput] = useState("");
      const [alertLanguage, setAlertLanguage] = useState("English");
      const [sosForm, setSosForm] = useState({ name: "", location: "", phone: "", details: "" });
      const [activePinpoint, setActivePinpoint] = useState(null);

      useEffect(() => {
        try { localStorage.setItem("cyclone_active_storm", activeStormId); } catch {}
      }, [activeStormId]);

      useEffect(() => {
        try { localStorage.setItem("cyclone_sos_pings", JSON.stringify(sosPings)); } catch {}
      }, [sosPings]);

      useEffect(() => {
        try { localStorage.setItem("cyclone_alerts", JSON.stringify(customAlerts)); } catch {}
      }, [customAlerts]);

      useEffect(() => {
        try { localStorage.setItem("cyclone_map_type", mapType); } catch {}
      }, [mapType]);

      const currentStorm = useMemo(() => {
        return CYCLONES_DATABASE.find((c) => c.id === activeStormId) || CYCLONES_DATABASE[0];
      }, [activeStormId]);

      useEffect(() => {
        if (!isSimulating) return;
        const timer = setInterval(() => {
          setSimOffsetHours((prev) => (prev >= 24 ? 0 : prev + 1));
        }, 3200);
        return () => clearInterval(timer);
      }, [isSimulating]);

      const simulatedPosition = useMemo(() => {
        const factor = simOffsetHours / 24;
        const latDelta = (currentStorm.nearbyCities[0]?.lat || currentStorm.lat) - currentStorm.lat;
        const lonDelta = (currentStorm.nearbyCities[0]?.lon || currentStorm.lon) - currentStorm.lon;
        return {
          lat: Number((currentStorm.lat + latDelta * factor * 0.8).toFixed(2)),
          lon: Number((currentStorm.lon + lonDelta * factor * 0.8).toFixed(2))
        };
      }, [currentStorm, simOffsetHours]);

      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return Math.round(R * c);
      };

      const playSpeechWarning = (message, lang = alertLanguage) => {
        if (!('speechSynthesis' in window)) {
          alert("Web Speech API is not supported in this browser.");
          return;
        }
        window.speechSynthesis.cancel();
        if (isSpeaking) {
          setIsSpeaking(false);
          return;
        }

        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        const langCodes = {
          English: "en-US",
          Hindi: "hi-IN",
          Odia: "hi-IN",
          Bengali: "bn-IN",
          Spanish: "es-ES"
        };
        utterance.lang = langCodes[lang] || "en-US";
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      const handleToggleDispatch = (id) => {
        setSosPings((prev) =>
          prev.map((item) =>
            item.id === id ? { ...item, dispatched: !item.dispatched } : item
          )
        );
      };

      const handleAddSos = (e) => {
        e.preventDefault();
        if (!sosForm.name || !sosForm.location) return;
        const cleanPhone = sosForm.phone ? sosForm.phone.trim() : "";
        const maskedPhone = cleanPhone
          ? `${cleanPhone.slice(0, 8)}XXXXX (Simulated)`
          : "+91-94371-XXXXX (Simulated)";

        const newPing = {
          id: `SOS-${Math.floor(100 + Math.random() * 900)}`,
          residentName: sosForm.name,
          phone: maskedPhone,
          location: sosForm.location,
          timestamp: "Just now",
          status: "Critical",
          details: sosForm.details || "Urgent rescue assistance requested at coastal sector.",
          dispatched: false
        };
        setSosPings([newPing, ...sosPings]);
        setSosForm({ name: "", location: "", phone: "", details: "" });
        setNewSosModal(false);
      };

      const handlePostAlert = (e) => {
        e.preventDefault();
        if (!broadcastInput.trim()) return;
        const newAlert = {
          id: `ALT-${Date.now().toString().slice(-4)}`,
          level: "EMERGENCY BROADCAST",
          audience: `All Disaster Management Units (${alertLanguage})`,
          text: broadcastInput.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setCustomAlerts([newAlert, ...customAlerts]);
        setBroadcastInput("");
      };

      const gmapsEmbedUrl = useMemo(() => {
        const qTarget = `${simulatedPosition.lat},${simulatedPosition.lon}`;
        return `https://maps.google.com/maps?q=${qTarget}&t=h&z=8&output=embed`;
      }, [simulatedPosition]);

      return (
        <div className="min-h-screen w-full max-w-full overflow-x-hidden bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-slate-950/95 backdrop-blur-md border-b border-cyan-900/40 shadow-2xl w-full">
            <div className="w-full max-w-[1720px] mx-auto px-2.5 sm:px-5 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="p-2 sm:p-2.5 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 text-slate-950 shadow-lg shadow-cyan-500/20 shrink-0">
                  <Icon name="shield" className="w-5 h-5 sm:w-6 sm:h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-sm sm:text-base lg:text-lg font-black tracking-wider text-white">
                      CYCLOSHIELD AI
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-cyan-950 text-cyan-400 border border-cyan-500/30">
                      {currentStorm.agency}
                    </span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse">
                      LEVEL-4 EMERGENCY
                    </span>
                  </div>
                  <p className="text-[10px] sm:text-[11px] text-slate-400 font-mono hidden xs:block">
                    National Severe Storm Telemetry, Evacuation Routing & Dispatch System
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <select
                  value={activeStormId}
                  onChange={(e) => setActiveStormId(e.target.value)}
                  className="bg-slate-900 text-cyan-300 px-2.5 sm:px-3 py-1.5 rounded-xl border border-cyan-500/40 text-xs font-mono font-bold focus:outline-none cursor-pointer"
                >
                  {CYCLONES_DATABASE.map((storm) => (
                    <option key={storm.id} value={storm.id}>
                      {storm.name.split(" ")[storm.name.split(" ").length - 1]} ({storm.category.split(" ")[0]})
                    </option>
                  ))}
                </select>

                <button
                  onClick={() => setIsSimulating(!isSimulating)}
                  className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 text-xs font-mono flex items-center gap-1.5 border border-slate-700 transition cursor-pointer"
                >
                  <Icon name={isSimulating ? "pause" : "play"} className="w-3.5 h-3.5 text-cyan-400" />
                  <span className="hidden sm:inline">{isSimulating ? "Ticking" : "Paused"}</span>
                  <span className="text-cyan-400 font-bold">T+{simOffsetHours}h</span>
                </button>
              </div>
            </div>

            <div className="w-full max-w-[1720px] mx-auto px-2 sm:px-5 lg:px-8 border-t border-slate-900">
              <nav className="flex items-center gap-1 sm:gap-2 py-1.5 overflow-x-auto no-scrollbar text-xs font-medium">
                {[
                  { id: "overview", label: "Mission Overview", icon: "shield" },
                  { id: "gmaps", label: "Google Maps Tracker (🌀)", icon: "globe" },
                  { id: "radar", label: "Doppler Radar & Cone", icon: "radio" },
                  { id: "structure", label: "Eyewall Vortex (0-18km)", icon: "layers" },

                    <Icon name="shield" className="w-5 h-5" />

                  <div className="leading-relaxed">
                    <div className="font-bold font-mono text-cyan-300 text-xs sm:text-sm uppercase mb-1">

                      <strong>Are the telephone numbers in this board real?</strong> <span className="text-emerald-400 font-bold">NO, THEY ARE 100% SYNTHETIC AND SIMULATED.</span> All resident names and telephone numbers (such as <code className="bg-slate-950 px-1.5 py-0.5 rounded text-amber-300 font-mono">+91-94371-XXXXX</code>) displayed in this dispatch board are mock simulated records created solely for training, emergency civil defense drills, and UI prototyping. No real persons or private cellular numbers are ever exposed, stored, or dialed.

                      <div className="space-y-2">
                        <div className="flex items-center justify-between text-xs">

                          <span className="font-mono text-slate-500 text-[11px]">{ping.timestamp}</span>
                        </div>
                        <div className="flex items-center gap-2 text-[11px] font-mono text-cyan-300 flex-wrap">
                          <span>{ping.location}</span>
                          <span>•</span>
                          <span className="text-amber-300 font-semibold">{ping.phone}</span>

                        <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/80">

                      <div className="mt-3.5 pt-3 border-t border-slate-800 flex items-center justify-between gap-2">

                          className={`px-2 py-0.5 rounded text-[10px] font-mono font-bold ${
                            ping.dispatched
                              ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"

                        <button

                            ping.dispatched

                          {ping.dispatched ? "Mark as Pending" : "Dispatch Rescue Team"}

                  <div>
                    <label className="text-slate-400 block mb-1">Exact Location / Landmark</label>

                      required
                      value={sosForm.location}
                      onChange={(e) => setSosForm({ ...sosForm, location: e.target.value })}

                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-red-500"

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setNewSosModal(false)}
                      className="px-3 py-2 rounded-lg bg-slate-800 text-slate-300 font-bold cursor-pointer"
                    >
                      Cancel

                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold cursor-pointer"

                      Broadcast Distress Ping

              <div className="text-[11px] text-slate-600">
                RUNS IN GOOGLE CHROME VIA FILE:// • PERSISTS TO LOCALSTORAGE • ZERO BUILD REQUIRED
              </div>
            </div>
          </footer>
        </div>

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<MainApp />);
  </script>
